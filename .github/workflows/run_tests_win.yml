name: Run the tests

on: [pull_request]

permissions:
  actions: read
  contents: read

jobs:
  build:
    env:
      PREFIX_WINDOWS: C:\Miniconda3\envs\cocofest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: [1, 2]
    name: Tests on ${{ matrix.os }}-shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Set prefix windows
        run: |
          echo "PREFIX=${{ env.PREFIX_WINDOWS }}" >> $GITHUB_ENV
        if: matrix.os == 'windows-latest'

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: 24.11.3-2
          conda-solver: libmamba
          activate-environment: cocofest
          environment-file: environment.yml
          conda-remove-defaults: true

      - name: Print Conda environment info
        run: |
          conda info
          conda list

      - name: Install extra dependencies
        run: conda install pip pytest-cov black pytest pytest-cov codecov packaging -cconda-forge

      - name: Run tests with code coverage
        run: pytest -v --color=yes --cov-report term-missing --cov=cocofest --cov-report=xml:coverage.xml tests/shard${{ matrix.shard }}

      - name: Archive coverage report
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage${{ matrix.shard }}
          path: |
            coverage.xml
            .coverage
          if-no-files-found: error
          include-hidden-files: true

  merge-coverage:
    needs: build
    runs-on: windows-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install coverage
        run: python -m pip install coverage==7.15.2

      - name: Download all workflow run artifacts
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Rename coverage files
        run: |
          for shard in {1,2}; do
            mv coverage${shard}/coverage.xml coverage${shard}.xml
            mv coverage${shard}/.coverage* .coverage${shard}
          done

      - name: Show current dir content
        run: pwd; ls -a -l

      - name: Merge coverage reports
        run: python -m coverage combine .coverage1 .coverage2

      - name: Show current dir content with new .coverage file
        run: pwd; ls -a

      - name: Generate XML report
        run: |
          python -m coverage xml
          python -m coverage report -m

      - name: Upload combined coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          verbose: true
